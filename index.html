<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Blitz</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05060a;
        overflow: hidden;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      canvas {
        display: block;
      }
      /* DEV 텔레메트리(seed/tick/hash/FPS). 캔버스 위에 그려지는 DOM 이라 겹치는 쪽을
         덮어 버린다 — 좌상단은 설정 톱니, 우상단은 레이더, 좌하단은 런 HUD 가 쓰므로
         유일하게 빈 우하단으로 보낸다(오른쪽 여백은 치트 패널 버튼 자리). */
      #hud {
        position: absolute;
        bottom: 8px;
        right: 56px;
        text-align: right;
        color: #b8f;
        font-family: monospace;
        font-size: 13px;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 0 4px #000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
