<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Blitz</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05060a;
        overflow: hidden;

        white-space: pre;
        pointer-events: none;
        text-shadow: 0 0 4px #000;
      }

    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
